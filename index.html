<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToneHub</title>
<meta name="description" content="ToneHub: a free guitar app. Get the tone. Learn the song.">
<style>
  :root { --bg:#F7F7F5; --text:#18181B; --muted:#4A4A50; --accent:#0B6E65; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --text:#F4F4F5; --muted:#C8C8CD; --accent:#5EE3D1; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--text); font:17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:520px; }
  h1 { font-size:40px; margin:0 0 4px; letter-spacing:-0.02em; }
  p { margin:0 0 12px; color:var(--muted); }
  a { color:var(--accent); }
  footer { margin-top:32px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ToneHub</h1>
  <p>A free guitar app for iPhone. Get the tone. Learn the song.</p>
  <p>Match the tone of a song to your own amp, then practise it: tuner, metronome, loops, drills and more.</p>
  <footer>Song key and tempo data by <a href="https://getsongbpm.com">GetSongBPM</a>.</footer>
</main>
</body>
</html>
